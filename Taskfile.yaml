version: '3'

vars:
  BINARY_NAME: krmgen
  MAIN_PATH: .
  BUILD_DIR: build
  GO_FILES:
    sh: find . -type f -name '*.go' -not -path "./vendor/*"
  HOME_DIR:
    sh: echo $HOME
  GIT_COMMIT:
    sh: git rev-parse --short=8 HEAD
  GIT_VERSION:
    sh: git describe --tags --always --dirty
  RELEASE_REPO: librucha/krmgen
  # Where install-release puts the binary. Override on the command line:
  # task install-release INSTALL_DIR=/usr/local/bin
  INSTALL_DIR: "{{.HOME_DIR}}/bin"

tasks:
  default:
    desc: "Display available tasks"
    cmds:
      - task --list
    silent: true

  install-tools:
    desc: "Install development tools"
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      - go install github.com/air-verse/air@latest

  build:
    desc: "Compile the project"
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} -ldflags "-s -w -X main.version={{.GIT_VERSION}}" {{.MAIN_PATH}}

  build-linux:
    desc: "Compile the project for Linux (amd64)"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=linux GOARCH=amd64 go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-linux-amd64 {{.MAIN_PATH}}

  run:
    desc: "Run the application"
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/{{.BINARY_NAME}}

  test:
    desc: "Run tests"
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...

  test-coverage:
    desc: "Run tests with coverage report"
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated to coverage.html"

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: "Format Go code"
    cmds:
      - go fmt ./...

  vet:
    desc: "Run go vet"
    cmds:
      - go vet ./...

  tidy:
    desc: "Clean up go.mod and go.sum"
    cmds:
      - go mod tidy

  deps:
    desc: "Download dependencies"
    cmds:
      - go mod download

  clean:
    desc: "Clean up build artifacts"
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f coverage.out coverage.html

  check:
    desc: "Run all checks (fmt, vet, lint, test)"
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  dev:
    desc: "Development mode with auto-reload (requires air)"
    cmds:
      - air

  docker-build:
    desc: "Build Docker image"
    cmds:
      - goreleaser release --clean --auto-snapshot --skip=publish

  release:
    desc: "Create release and publish Docker images"
    preconditions:
      - sh: test -n "$DOCKER_USERNAME"
        msg: "DOCKER_USERNAME is not set"
      - sh: test -n "$DOCKER_PASSWORD"
        msg: "DOCKER_PASSWORD is not set"
    cmds:
      - goreleaser release --clean --auto-snapshot

  upgrade:
    desc: "Upgrade Go and all dependencies"
    cmds:
      - go get -v -u all
      - go mod tidy

  install:
    desc: "Install compiled the project"
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    env:
      GOBIN: "{{.HOME_DIR}}/go/bin"
    cmds:
      - go install -ldflags "-s -w -X main.version={{.GIT_VERSION}}"

  install-release:
    desc: "Install the latest published GitHub release into ~/bin (no build; override with INSTALL_DIR=)"
    preconditions:
      - sh: command -v curl
        msg: "curl is required to download the release"
      - sh: command -v tar
        msg: "tar is required to unpack the release"
    cmds:
      - |
        set -eu

        # Archive names come from .goreleaser.yaml's name_template:
        # krmgen_<version>_<os>_<x86_64|arm64>.tar.gz
        case "$(uname -s)" in
          Linux)  os=linux ;;
          Darwin) os=darwin ;;
          *)
            echo "install-release supports Linux and macOS; on $(uname -s) take an archive from https://github.com/{{.RELEASE_REPO}}/releases/latest by hand" >&2
            exit 1
            ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64)  arch=x86_64 ;;
          arm64|aarch64) arch=arm64 ;;
          *) echo "no release is built for $(uname -m)" >&2; exit 1 ;;
        esac

        tag=$(curl -fsSL "https://api.github.com/repos/{{.RELEASE_REPO}}/releases/latest" \
          | sed -n 's/.*"tag_name" *: *"\([^"]*\)".*/\1/p' | head -1)
        if [ -z "$tag" ]; then
          echo "could not resolve the latest release of {{.RELEASE_REPO}}" >&2
          exit 1
        fi
        archive="{{.BINARY_NAME}}_${tag#v}_${os}_${arch}.tar.gz"
        base="https://github.com/{{.RELEASE_REPO}}/releases/download/$tag"

        tmp=$(mktemp -d)
        echo "Downloading $archive ($tag)"
        curl -fsSL -o "$tmp/$archive" "$base/$archive"
        curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"

        # The release ships a sha256 manifest; a mismatch means the download is
        # not what was published, so refuse it rather than install it.
        grep "[[:space:]]$archive\$" "$tmp/checksums.txt" > "$tmp/expected.txt"
        if command -v sha256sum >/dev/null 2>&1; then
          (cd "$tmp" && sha256sum -c expected.txt >/dev/null)
        else
          (cd "$tmp" && shasum -a 256 -c expected.txt >/dev/null)
        fi

        tar -xzf "$tmp/$archive" -C "$tmp" {{.BINARY_NAME}}
        mkdir -p "{{.INSTALL_DIR}}"
        install -m 0755 "$tmp/{{.BINARY_NAME}}" "{{.INSTALL_DIR}}/{{.BINARY_NAME}}"
        rm -rf "$tmp"

        echo "Installed $("{{.INSTALL_DIR}}/{{.BINARY_NAME}}" --version) to {{.INSTALL_DIR}}/{{.BINARY_NAME}}"
        case ":$PATH:" in
          *":{{.INSTALL_DIR}}:"*) ;;
          *) echo "note: {{.INSTALL_DIR}} is not on your PATH" >&2 ;;
        esac
