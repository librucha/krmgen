name: Prepare feature KrmGen
permissions:
  contents: write
on:
  push:
    branches:
      - 'feature/**'

jobs:
  publishFeature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # setup-go v6 tightened toolchain resolution, and '^1.20' predated
          # go.mod's move to the post-1.21 patch-version format anyway - it
          # cannot express the 1.26.0 the module now needs. Take the version
          # from go.mod, the way the other workflows do.
          go-version-file: go.mod

      # `make test` runs the golden-master suite in test/golden, which packages
      # fixture charts with helm and compares the external kubectl backend
      # against the embedded one. Both binaries have to be on PATH, pinned to
      # the pair the goldens were generated with - see the Test job in go.yml.
      - name: Set up helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.36.3

      - name: Build feature platforms
        run: |
          make test

      # Only this one tag is moved. `git push -f --tags` would force every
      # local tag onto the remote, which on a runner that has fetched the
      # release tags is a way to rewrite them by accident.
      - name: Create tag
        run: |
          git tag -f latest-snapshot
          git push -f origin latest-snapshot
