name: Release KrmGen

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  # Dry run: exercise the whole release path - QEMU, buildx, GPG, the docker
  # images - without publishing anything. Without this the release job only
  # ever runs when a tag is already cut, so a broken step is found too late.
  workflow_dispatch:

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # goreleaser needs the full history and all tags for changelog generation
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # the config uses Pro-only features (dockerhub description sync)
          distribution: goreleaser-pro
          version: '~> v2'
          # --snapshot implies --skip=announce,publish,validate, so a manual
          # run builds and packages everything (docker images included) and
          # pushes none of it. The Docker Hub description sync is a publish of
          # its own, hence the extra skip.
          args: >-
            release --clean
            ${{ github.event_name == 'workflow_dispatch' && '--snapshot --skip=dockerhub' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
