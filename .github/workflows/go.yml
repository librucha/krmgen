name: Build KrmGen
on:
  push:
    branches:
      - 'develop'
      - 'release/**'
      - 'main'
    tags-ignore:
      - 'v*'
      - 'draft-*'
  pull_request:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Built from source with the Go from go.mod rather than pulled as a
      # prebuilt binary: the released v2.6.2 binaries are built with go1.25
      # and refuse to lint a module targeting a newer Go ("the Go language
      # version used to build golangci-lint is lower than the targeted Go
      # version"). Pinned to the same v2.6.2 that Taskfile.yaml installs, so
      # CI and developer runs agree on findings; see .golangci.yml for the
      # linter set.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2

      - name: golangci-lint
        run: golangci-lint run ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      # go-version-file resolves the toolchain from go.mod (currently 1.26.0),
      # so checkout must run first; the previous '^1.20' pin predated go.mod's
      # move to the post-1.21 patch-version format and could no longer even
      # parse it.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get dependencies
        run: |
          go get -v -t -d ./...
          if [ -f Gopkg.toml ]; then
              curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
              dep ensure
          fi
      - name: Check the build
        shell: bash -l {0}
        run: |
          export PATH=${PATH}:`go env GOPATH`/bin
          make build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The golden-master suite in test/golden compares byte-for-byte against
      # goldens generated on one specific helm/kubectl pair (see
      # test/golden/versions_test.go). Pin CI to that exact pair so the
      # goldens compare cleanly; the specification's support matrix (helm
      # 3.8.0+, including 4.x) is what krmgen supports at runtime, not what
      # the golden fixtures are anchored to.
      - name: Set up helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.36.3

      - name: Verify tool versions
        run: |
          helm version --short
          kubectl version --client | grep -i kustomize

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
