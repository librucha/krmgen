name: Release feature KrmGen
permissions:
  contents: write
on:
  push:
    tags:
      - 'latest-snapshot'

jobs:
  publishFeature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # setup-go v6 tightened toolchain resolution, and '^1.20' predated
          # go.mod's move to the post-1.21 patch-version format anyway - it
          # cannot express the 1.26.0 the module now needs. Take the version
          # from go.mod, the way the other workflows do.
          go-version-file: go.mod

      - name: Build feature platforms
        run: |
          sudo apt-get install rhash -y
          make all-dist CLI_PLATFORMS="darwin-amd64 linux-amd64"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/*
          prerelease: true
          fail_on_unmatched_files: true
