apiVersion: krmgen.config.librucha.com/v1alpha1
kind: KrmGen
helm:
  charts:
    - name: demo
      repo: '{{ argocdEnv "CHART_REPO" }}'
      releaseName: '{{ kubeEnv "RELEASE" "fallback-release" }}'
      version: 0.1.0
      ignoreCredentials: true
      valuesInline:
        message: '{{ argocdEnv "MESSAGE" "default-message" }}'
