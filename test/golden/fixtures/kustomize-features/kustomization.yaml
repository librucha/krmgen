apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: features
namePrefix: pre-
nameSuffix: -suf
labels:
  - pairs:
      managed-by: krmgen
    includeSelectors: true
resources:
  - base.yaml
patches:
  - path: patch.yaml
configMapGenerator:
  - name: generated
    literals:
      - key=value
