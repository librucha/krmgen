version: 2

project_name: krmgen

before:
  hooks:
    - go mod tidy

builds:
  - id: krmgen
    main: .
    binary: krmgen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [ tar.gz ]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [ zip ]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-devel"

dockers_v2:
  - id: krmgen
    images:
      - librucha/krmgen
    platforms:
      - linux/arm64
      - linux/amd64
    tags:
      - "{{.Version}}"
      - latest
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.description": "CLI tool for generate Kubernetes Resource Model from helm and kustomization together"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.vendor": "librucha@gmail.com"

signs:
  - id: checksums
    artifacts: checksum
    cmd: gpg
    # GPG_FINGERPRINT is exported by the import-gpg action in CI
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

changelog:
  # Let GitHub build the release notes automatically from commits and PRs
  use: github-native

release:
  disable: false
  github:
    owner: librucha
    name: krmgen
  # Use GitHub's auto-generated release notes as the release body
  mode: replace
  draft: false
  prerelease: auto
  make_latest: true
  name_template: "{{ .ProjectName }} {{ .Version }}"

dockerhub:
  - description: "CLI tool for generate Kubernetes Resource Model from helm and kustomization together"


