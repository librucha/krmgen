version: 2

project_name: krmgen

before:
  hooks:
    - go mod tidy
    - ./hack/completions.sh

builds:
  - id: krmgen
    main: .
    binary: krmgen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

# Sign and notarize the darwin binaries with the Developer ID certificate.
# Runs on the Linux release runner (no Xcode needed). Disabled when the
# certificate is absent, so local builds and snapshots still work.
notarize:
  macos:
    - ids: [ krmgen ]
      enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        # base64 of the "Developer ID Application" .p12 export
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        # App Store Connect API key (Users and Access > Integrations)
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        # base64 of the AuthKey_<key_id>.p8 file
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: default
    formats: [ tar.gz ]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [ zip ]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - completions/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-devel"

dockers_v2:
  - id: krmgen
    images:
      - librucha/krmgen
    platforms:
      - linux/arm64
      - linux/amd64
    tags:
      - "{{.Version}}"
      - latest
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.description": "Render Helm charts and Kustomize overlays with Go templates into static Kubernetes YAML"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.url": "https://hub.docker.com/r/librucha/krmgen"
      "org.opencontainers.image.documentation": "https://github.com/librucha/krmgen#readme"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.vendor": "librucha@gmail.com"

signs:
  - id: checksums
    artifacts: checksum
    cmd: gpg
    # GPG_FINGERPRINT is exported by the import-gpg action in CI
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

changelog:
  # Let GitHub build the release notes automatically from commits and PRs
  use: github-native

release:
  disable: false
  github:
    owner: librucha
    name: krmgen
  # Use GitHub's auto-generated release notes as the release body
  mode: replace
  draft: false
  prerelease: auto
  make_latest: true
  name_template: "{{ .ProjectName }} {{ .Version }}"

# Homebrew cask in librucha/homebrew-tap: `brew install librucha/tap/krmgen`.
# GITHUB_TOKEN of the release workflow cannot push to another repository,
# hence the dedicated token with contents:write on the tap.
homebrew_casks:
  - name: krmgen
    repository:
      owner: librucha
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/librucha/krmgen
    description: Render Helm charts and Kustomize overlays with Go templates into static Kubernetes YAML
    license: MIT
    # Linked by brew into its bash_completion.d / site-functions /
    # vendor_completions.d; generated by hack/completions.sh.
    completions:
      bash: completions/krmgen.bash
      zsh: completions/krmgen.zsh
      fish: completions/krmgen.fish
    commit_msg_template: "chore(krmgen): update cask to {{ .Tag }}"
    # prereleases must not move what `brew install` resolves to
    skip_upload: auto
    # No quarantine-stripping hook: the darwin binaries are signed and
    # notarized (see `notarize`), so Gatekeeper accepts them as downloaded.

# Docker Hub repository overview (Pro). `docker push` cannot set it, so this
# pipe calls the Hub API after the images are published. Without `images`
# the pipe has nothing to update - which is why the Hub page used to be empty.
dockerhub:
  - images:
      - librucha/krmgen
    # username defaults to DOCKER_USERNAME, the token to DOCKER_PASSWORD -
    # both already exported by the release workflow. The account needs
    # editor rights on the repository.
    # Docker Hub limit: 100 characters.
    description: "Render Helm charts and Kustomize overlays with Go templates into static Kubernetes YAML"
    full_description:
      from_file:
        path: ./docs/dockerhub.md


